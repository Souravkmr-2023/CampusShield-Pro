services:
  mysql:
    image: mysql:8.4
    container_name: campusshield-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Sour@v@2003
      MYSQL_DATABASE: campusshield
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: campusshield-pma
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: Sour@v@2003
    ports:
      - "8081:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
